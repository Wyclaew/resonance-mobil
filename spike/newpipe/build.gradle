plugins { id 'application' }
repositories { mavenCentral(); maven { url 'https://jitpack.io' } }
dependencies { implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5' }
application { mainClass = project.findProperty('mainClass') ?: 'Spike' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.named('run') { if (project.hasProperty('args')) args project.property('args').split(' ') }
